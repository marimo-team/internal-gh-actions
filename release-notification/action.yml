name: Release notification
description: Send a JSON-safe Slack notification for one job or all required publishers
inputs:
  status:
    description: Job status (used when results is absent)
    default: ''
  results:
    description: JSON from toJSON(needs); every listed job must succeed
    default: ''
  slack-webhook-url:
    description: Slack incoming webhook URL
    required: true
  artifact-url:
    description: Release or marketplace URL
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RELEASE_STATUS: ${{ inputs.status }}
        RELEASE_RESULTS: ${{ inputs.results }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        RELEASE_ARTIFACT: ${{ inputs.artifact-url }}
      run: node "$GITHUB_ACTION_PATH/../lib/cli.mjs" notify
