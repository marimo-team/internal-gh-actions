name: Test release primitives
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test test/*.test.mjs
        env:
          RELEASE_SANDBOX_TEST: '1'
          GH_TOKEN: host-only-test-sentinel
          RELEASE_APP_PRIVATE_KEY: host-only-test-sentinel
