name: Tag merged release
description: Validate a merged release PR and create an immutable annotated tag
inputs:
  app-id:
    description: Release GitHub App ID
    required: true
  private-key:
    description: Release GitHub App private key
    required: true
  base:
    description: Release base branch
    default: main
  manifest:
    description: JSON manifest with a top-level version field
    default: package.json
outputs:
  tag:
    description: Release tag
    value: ${{ steps.tag.outputs.tag }}
  created:
    description: Whether this run created the tag
    value: ${{ steps.tag.outputs.created }}
runs:
  using: composite
  steps:
    - name: Validate merged release
      shell: bash
      env:
        RELEASE_BASE: ${{ inputs.base }}
        RELEASE_MANIFEST: ${{ inputs.manifest }}
      run: node "$GITHUB_ACTION_PATH/../lib/cli.mjs" tag-check
    - id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
    - id: tag
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        RELEASE_BASE: ${{ inputs.base }}
        RELEASE_MANIFEST: ${{ inputs.manifest }}
      run: node "$GITHUB_ACTION_PATH/../lib/cli.mjs" tag
