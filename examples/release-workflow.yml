name: Release example
on:
  push:
    tags: ['v*.*.*']
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        uses: marimo-team/internal-gh-actions/validate-release@REPLACE_WITH_REVIEWED_SHA
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Repository-owned publishing
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: echo "Replace this step with publication of version $VERSION"
  notify:
    if: always()
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: marimo-team/internal-gh-actions/release-notification@REPLACE_WITH_REVIEWED_SHA
        with:
          results: ${{ toJSON(needs) }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
          artifact-url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
