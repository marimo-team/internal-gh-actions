name: Prepare release PR
run-name: "Release ${{ inputs.version }} requested by @${{ github.actor }}"
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version or bump name
        type: string
        required: true
permissions: {}
concurrency:
  group: prepare-release-pr
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      # Install the repository adapter's runtime before preparation.
      - id: version
        uses: marimo-team/internal-gh-actions/prepare-release@REPLACE_WITH_REVIEWED_SHA
        with:
          version: ${{ inputs.version }}
      - uses: marimo-team/internal-gh-actions/release-pr@REPLACE_WITH_REVIEWED_SHA
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          version: ${{ steps.version.outputs.version }}
          current-version: ${{ steps.version.outputs.current-version }}
          manifest: ${{ steps.version.outputs.manifest }}
          files: ${{ steps.version.outputs.files }}

  notify-approval:
    name: Notify release approval
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 12
    permissions:
      actions: read
      pull-requests: read
      contents: read
    steps:
      - uses: marimo-team/internal-gh-actions/release-approval-notification@REPLACE_WITH_REVIEWED_SHA
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
